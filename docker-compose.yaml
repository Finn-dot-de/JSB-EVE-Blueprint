services:
  postgres:
    image: postgres:15
    container_name: eve_postgres
    restart: unless-stopped
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_DB: eve_own_auth
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_own_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  sde-updater:
    build:
      context: ./eve_sde
      dockerfile: Dockerfile
    container_name: eve_sde_updater
    profiles: ["dev", "prod"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=eve_own_auth
      - PG_USER=eve_user
      - PG_PASS=${POSTGRES_PASSWORD:-secret_password}
      - FORCE_SDE_UPDATE=false

  backend:
    build: .
    container_name: eve_backend
    restart: unless-stopped
    profiles: ["dev", "prod"]
    depends_on:
      postgres:
        condition: service_healthy
      sde-updater:
        condition: service_completed_successfully
    ports:
      # Ebenfalls nur lokal: nach aussen geht alles ueber den Reverse-Proxy,
      # sonst liesse sich HTTPS und die Zugriffskontrolle davor umgehen.
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/eve_own_auth
      - SPRING_DATASOURCE_USERNAME=eve_user
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-secret_password}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    healthcheck:
      # busybox-wget ist im Alpine-Image vorhanden, curl nicht.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend-dev:
    build:
      context: frontend
      target: dev
    container_name: eve_frontend_dev
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      backend:
        condition: service_started
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  frontend-prod:
    build:
      context: frontend
      target: prod
    container_name: eve_frontend_prod
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      backend:
        condition: service_started
    expose:
      - "80"

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"     # HTTP (Für Let's Encrypt und Weiterleitungen)
      - "443:443"   # HTTPS (Das SSL-Zertifikat)
      - "81:81"     # Das Admin-Interface
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend-prod
      - backend