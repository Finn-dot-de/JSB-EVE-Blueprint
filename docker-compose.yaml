services:
  postgres:
    image: postgres:15
    container_name: eve_postgres
    restart: unless-stopped
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  sde-updater:
    build:
      context: ./eve_sde
      dockerfile: Dockerfile
    container_name: eve_sde_updater
    profiles: ["dev", "prod"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=${DB_NAME}
      - PG_USER=${DB_USER}
      - PG_PASS=${DB_PASSWORD}
      - FORCE_SDE_UPDATE=false

  backend:
    build: .
    container_name: eve_backend
    restart: unless-stopped
    profiles: ["dev", "prod"]
    depends_on:
      postgres:
        condition: service_healthy
      sde-updater:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  # ==========================================
  # Der Go Token-Sync Worker
  # ==========================================
  go-eve-sync-worker:
    build:
      context: ./eve-sync-worker
      dockerfile: Dockerfile
    container_name: eve_eve-sync-worker
    restart: unless-stopped
    profiles: [ "dev", "prod" ]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_DSN=host=postgres port=5432 user=${DB_USER} password=${DB_PASSWORD} dbname=${DB_NAME} sslmode=disable

  frontend-dev:
    build:
      context: frontend
      target: dev
    container_name: eve_frontend_dev
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      backend:
        condition: service_started
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  frontend-prod:
    build:
      context: frontend
      target: prod
    container_name: eve_frontend_prod
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      backend:
        condition: service_started
    expose:
      - "80"

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend-prod
      - backend