<div class="app-layout">
  <app-navbar></app-navbar>

  <div class="content-wrapper">

    @if (authService.loading()) {
      <div class="global-loading">
        <i class="fa-solid fa-satellite-dish fa-spin fa-3x"></i>
        <h2>Verbinde mit EVE Datenbank...</h2>
        <p>Autorisierung wird geprüft</p>
      </div>
    } @else {

      @if (authService.currentUser()) {
        <app-sidebar></app-sidebar>
      }

      <main class="main-content">
        <!-- Wer abgemeldet ist, sucht nicht danach - er muss darueber
             stolpern. Deshalb im Rahmen und nicht auf einer Unterseite. -->
        @if (authService.currentUser()) {
          <app-token-health-banner></app-token-health-banner>
        }
        <router-outlet></router-outlet>
      </main>

    }

  </div>
</div>

<app-toast></app-toast>
<app-confirm></app-confirm>
