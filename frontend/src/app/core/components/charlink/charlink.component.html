<div class="roles-container">
  <div class="section-divider">
    <span>Character Management</span>
  </div>

  <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
    <button class="btn-primary" (click)="addAlt()">
      <i class="fa-solid fa-plus"></i> Weiteren EVE Charakter verlinken
    </button>

    @if (isLeadership) {
      <button class="btn-secondary" routerLink="/charlink/stats" style="border-color: #00dfa2; color: #00dfa2;">
        <i class="fa-solid fa-chart-pie"></i> Corporation Statistik
      </button>
    }
  </div>

  @if (loading()) {
    <div class="loading-container"><div class="loading-spinner"></div></div>
  } @else {
    <div class="surface-panel">
      <h3 style="margin-top: 0; margin-bottom: 1.5rem; color: var(--text-primary);">Deine verlinkten Charaktere</h3>

      <div style="display: flex; flex-direction: column; gap: 1rem;">
        @for (char of characters(); track char.id) {
          <div style="display: flex; align-items: center; gap: 1rem; padding: 1rem; background-color: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 8px;">
            <img [src]="char.portraitUrl" style="width: 48px; height: 48px; border-radius: 6px; border: 1px solid var(--border-color);">
            <div style="flex: 1;">
              <div style="font-size: 1.1rem; color: var(--text-primary); font-weight: 500;">
                {{ char.name }}
                @if (char.isMain) {
                  <span style="font-size: 0.7rem; background-color: rgba(37, 99, 235, 0.2); color: var(--accent-color); padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle;">MAIN</span>
                }
              </div>
              <div style="font-size: 0.85rem; color: var(--text-secondary);">ID: {{ char.id }}</div>
            </div>
          </div>
        }
      </div>
    </div>
  }
</div>
