<div class="roles-container">
  <div class="section-divider">
    <span>Corporation Auth Statistik</span>
  </div>

  @if (loading()) {
    <div class="loading-container"><div class="loading-spinner"></div></div>
  } @else if (errorMsg()) {
    <div class="surface-panel text-center">
      <i class="fa-solid fa-triangle-exclamation fa-3x" style="color: #ff3366; margin-bottom: 1rem;"></i>
      <p style="color: #ff3366;">{{ errorMsg() }}</p>
    </div>
  } @else if (stats(); as s) {
    <div class="surface-panel" style="display: flex; gap: 3rem; align-items: center; justify-content: center; flex-wrap: wrap;">

      <!-- Der magische CSS Pie Chart -->
      <div class="pie-chart-container">
        <div class="pie-chart" [style.background]="'conic-gradient(#00dfa2 0% ' + authPercentage() + '%, rgba(255,255,255,0.05) ' + authPercentage() + '% 100%)'">
          <div class="pie-inner">
            <span class="pie-percent">{{ authPercentage() }}%</span>
            <span class="pie-label">Auth Quote</span>
          </div>
        </div>
      </div>

      <!-- Die harten Fakten daneben -->
      <div class="stats-details" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="stat-row">
          <i class="fa-solid fa-users" style="color: var(--text-secondary); font-size: 1.5rem; width: 30px;"></i>
          <div>
            <div style="font-size: 1.8rem; color: var(--text-primary); font-weight: 600;">
              {{ s.registeredMains }} / {{ s.totalEsiMembers }}
            </div>
            <div style="color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase;">Mains im Auth registriert</div>
          </div>
        </div>

        <div class="stat-row">
          <i class="fa-solid fa-user-astronaut" style="color: var(--accent-color); font-size: 1.5rem; width: 30px;"></i>
          <div>
            <div style="font-size: 1.5rem; color: var(--text-primary); font-weight: 600;">{{ s.registeredAlts }}</div>
            <div style="color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase;">Zusätzliche Alts im Auth</div>
          </div>
        </div>
      </div>

    </div>
  }
</div>
