<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MA-Auth</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Farbe der Systemleiste im installierten Fenster. Muss zum
       background_color im Manifest passen, sonst blitzt beim Start ein
       heller Rahmen auf. -->
  <meta name="theme-color" content="#0d1117">
  <!-- iOS liest das Manifest nicht; ohne diese beiden Zeilen landet auf dem
       Startbildschirm ein Lesezeichen, das Safari mit Adressleiste oeffnet. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script>
    (function () {
      try {
        let choice = localStorage.getItem('theme');
        if (choice === 'light') choice = 'dim';
        if (choice === 'dim' || choice === 'dark' || choice === 'ma') {
          document.documentElement.setAttribute('data-theme', choice);
        }
      } catch (e) {
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
