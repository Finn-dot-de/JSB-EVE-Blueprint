spring.application.name=eve-blueprint

spring.task.scheduling.pool.size=8

# EVE API Configuration
eve.esi.base-url=${EVE_ESI_BASE_URL}
eve.sso.client-id=${EVE_CLIENT_ID}
eve.sso.client-secret=${EVE_CLIENT_SECRET}
eve.sso.scopes=${EVE_SCOPES:publicData}
eve.sso.allowed-corp-id=${EVE_ALLOWED_CORP}
eve.alt-corp-ids=${EVE_ALT_CORP_IDS:}

# Server Config
app.base.url=${BASE_URL}
app.frontend.url=${APP_FRONTEND_URL}
app.jwt.secret=${APP_JWT_SECRET}

encryption.aes-key=${KEYYY}

# Wer das Admin-Panel oeffnen darf: Charakternamen oder Charakter-IDs, per Komma getrennt.
# Ohne Eintrag hier kann niemand die Anwendung einrichten.
buybot.admin-characters=${ADMIN_CHARACTERS:}

# Audit-Protokoll
# Aufbewahrungsdauer in Tagen; aeltere Eintraege werden taeglich geloescht.
buybot.audit.retention-days=${AUDIT_RETENTION_DAYS:30}
# Erfolgreiche Lesezugriffe mitschreiben. Aus = nur Schreibzugriffe, Fehler und Admin-Aktionen.
buybot.audit.log-successful-reads=${AUDIT_LOG_READS:false}

# Fehlerantworten ohne interne Details
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Nur der Health-Endpunkt nach aussen, fuer den Docker-Healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never