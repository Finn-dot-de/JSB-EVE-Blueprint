spring.application.name=eve-blueprint

# EVE API Configuration
eve.esi.base-url=${EVE_ESI_BASE_URL}
eve.sso.client-id=${EVE_CLIENT_ID}
eve.sso.client-secret=${EVE_CLIENT_SECRET}
eve.sso.scopes=${EVE_SCOPES:publicData}
eve.sso.allowed-corp-id=${EVE_ALLOWED_CORP}
eve.alt-corp-ids=${EVE_ALT_CORP_IDS:}

# Server Config
app.base.url=${BASE_URL}
app.frontend.url=${APP_FRONTEND_URL}
app.jwt.secret=${APP_JWT_SECRET}

encryption.aes-key=${KEYYY}

# Discord Configuration
discord.client-id=${DISCORD_CLIENT_ID}
discord.client-secret=${DISCORD_CLIENT_SECRET}
discord.bot-token=${DISCORD_BOT_TOKEN}
discord.server-id=${DISCORD_GUILD_ID}

# Flotten-Pings.
# Ohne Kanal-ID ist die Funktion abgeschaltet: Sie meldet sich beim Start mit
# einer Warnung ab, der Statusendpunkt sagt "nicht verfuegbar", und ein Versuch
# endet als 503 mit Hinweis - statt als Fehler, der nach einem Programmfehler
# aussieht. Bewusst OHNE Vorgabewert: Es gibt keinen vernuenftigen Standardkanal,
# und ein geratener waere der falsche - mit einem @here darin.
discord.fleet-ping-channel-id=${DISCORD_FLEET_PING_CHANNEL_ID:}
# Die VORBELEGTE Rolle der Auswahl "Rolle". Nur noch eine Vorbelegung: Welche
# Rollen ueberhaupt pingbar sind, steht seit dem Umbau in discord_role_mappings
# und wird unter /admin/discord gepflegt. Der Wert hier wird genauso gegen diese
# Zuordnungen geprueft wie eine Kennung aus der Anfrage - steht hier eine, die
# dort nicht vorkommt, ist sie wirkungslos, und ein Rollen-Ping ohne eigene
# Angabe wird mit genau dieser Begruendung abgewiesen. Leer lassen ist in
# Ordnung: Dann ist nichts vorbelegt und der FC waehlt jedes Mal.
discord.fleet-ping-role-id=${DISCORD_FLEET_PING_ROLE_ID:}
# Wartezeit zwischen zwei Pings desselben Charakters. Gegen den Doppelklick, der
# sonst zwei @here ausloest. 0 schaltet sie ab.
fleet.ping.cooldown=${FLEET_PING_COOLDOWN:60s}

# ESI Caching (konditionale Requests mit ETags)
esi.etag.enabled=${ESI_ETAG_ENABLED:true}
esi.etag.cache-payloads=${ESI_ETAG_CACHE_PAYLOADS:true}
esi.etag.max-payload-bytes=${ESI_ETAG_MAX_PAYLOAD_BYTES:262144}
esi.etag.retention-days=${ESI_ETAG_RETENTION_DAYS:30}
eve.esi.user-agent=${EVE_ESI_USER_AGENT:EveOwnAuth-Tool}


eve.market.region-id=${EVE_MARKET_REGION_ID:10000002}
eve.market.station-id=${EVE_MARKET_STATION_ID:60003760}
eve.market.station-system-id=${EVE_MARKET_STATION_SYSTEM_ID:30000142}
eve.market.min-usable-prices=${EVE_MARKET_MIN_USABLE_PRICES:1000}
eve.market.rate-limit-reserve=${EVE_MARKET_RATE_LIMIT_RESERVE:200}
eve.market.error-limit-reserve=${EVE_MARKET_ERROR_LIMIT_RESERVE:10}
eve.market.page-delay-millis=${EVE_MARKET_PAGE_DELAY_MILLIS:0}


