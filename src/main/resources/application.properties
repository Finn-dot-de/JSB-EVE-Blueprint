spring.application.name=eve-blueprint

# EVE API Configuration
eve.esi.base-url=${EVE_ESI_BASE_URL}
eve.sso.client-id=${EVE_CLIENT_ID}
eve.sso.client-secret=${EVE_CLIENT_SECRET}
eve.sso.scopes=${EVE_SCOPES:publicData}
eve.sso.allowed-corp-id=${EVE_ALLOWED_CORP}
eve.alt-corp-ids=${EVE_ALT_CORP_IDS:}

# Server Config
app.base.url=${BASE_URL}
app.frontend.url=${APP_FRONTEND_URL}
app.jwt.secret=${APP_JWT_SECRET}

encryption.aes-key=${KEYYY}

# Discord Configuration
discord.client-id=${DISCORD_CLIENT_ID}
discord.client-secret=${DISCORD_CLIENT_SECRET}
discord.bot-token=${DISCORD_BOT_TOKEN}
discord.server-id=${DISCORD_GUILD_ID}

# ESI Caching (konditionale Requests mit ETags)
esi.etag.enabled=${ESI_ETAG_ENABLED:true}
esi.etag.cache-payloads=${ESI_ETAG_CACHE_PAYLOADS:true}
esi.etag.max-payload-bytes=${ESI_ETAG_MAX_PAYLOAD_BYTES:262144}
esi.etag.retention-days=${ESI_ETAG_RETENTION_DAYS:30}
eve.esi.user-agent=${EVE_ESI_USER_AGENT:EveOwnAuth-Tool}


eve.market.region-id=${EVE_MARKET_REGION_ID:10000002}
eve.market.station-id=${EVE_MARKET_STATION_ID:60003760}
eve.market.min-usable-prices=${EVE_MARKET_MIN_USABLE_PRICES:1000}
eve.market.rate-limit-reserve=${EVE_MARKET_RATE_LIMIT_RESERVE:200}
eve.market.error-limit-reserve=${EVE_MARKET_ERROR_LIMIT_RESERVE:10}
eve.market.page-delay-millis=${EVE_MARKET_PAGE_DELAY_MILLIS:0}


eve.alt-detection.weight-name=${EVE_ALT_WEIGHT_NAME:40}
eve.alt-detection.weight-join=${EVE_ALT_WEIGHT_JOIN:45}
eve.alt-detection.weight-mining=${EVE_ALT_WEIGHT_MINING:15}
eve.alt-detection.min-probability=${EVE_ALT_MIN_PROBABILITY:80}
eve.alt-detection.min-available-signals=${EVE_ALT_MIN_AVAILABLE_SIGNALS:1}
eve.alt-detection.min-probability-single-signal=${EVE_ALT_MIN_PROBABILITY_SINGLE_SIGNAL:90}
eve.alt-detection.name-family-match-score=${EVE_ALT_NAME_FAMILY_MATCH_SCORE:85}
eve.alt-detection.name-family-min-length=${EVE_ALT_NAME_FAMILY_MIN_LENGTH:4}
eve.alt-detection.name-numbered-twin-score=${EVE_ALT_NAME_NUMBERED_TWIN_SCORE:95}
eve.alt-detection.name-alt-suffixes=${EVE_ALT_NAME_SUFFIXES:alt,alts,jr,junior,ii,iii,iv,v,vi,2,3,4,5,6,7,8,9}
eve.alt-detection.join-full-window=${EVE_ALT_JOIN_FULL_WINDOW:15m}
eve.alt-detection.join-zero-window=${EVE_ALT_JOIN_ZERO_WINDOW:3d}
eve.alt-detection.join-cluster-dilution=${EVE_ALT_JOIN_CLUSTER_DILUTION:true}
eve.alt-detection.join-cluster-min-size=${EVE_ALT_JOIN_CLUSTER_MIN_SIZE:3}
eve.alt-detection.mining-min-shared-days=${EVE_ALT_MINING_MIN_SHARED_DAYS:2}
eve.alt-detection.mining-rarity-exponent=${EVE_ALT_MINING_RARITY_EXPONENT:1.0}
eve.alt-detection.group-unregistered=${EVE_ALT_GROUP_UNREGISTERED:true}
eve.alt-detection.group-min-members=${EVE_ALT_GROUP_MIN_MEMBERS:2}
eve.alt-detection.group-max-members=${EVE_ALT_GROUP_MAX_MEMBERS:8}
eve.alt-detection.calibration-default-limit=${EVE_ALT_CALIBRATION_DEFAULT_LIMIT:50}
eve.alt-detection.calibration-max-limit=${EVE_ALT_CALIBRATION_MAX_LIMIT:200}
eve.alt-detection.max-pairs-per-corporation=${EVE_ALT_MAX_PAIRS_PER_CORPORATION:250000}


spring.task.scheduling.pool.size=8
